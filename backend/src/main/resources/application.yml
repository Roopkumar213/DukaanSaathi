server:
  port: 8080

spring:
  application:
    name: dukaanai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

dukaanai:
  jwt:
    secret: "dukaanai-super-secret-kirana-key-for-jwt-signing-minimum-256-bits-long!"
    expiration-ms: 86400000 # 24 hours
  storage:
    upload-dir: "uploads"
  ai:
    provider: ${AI_PROVIDER:mock} # 'mock' or 'gemini'
    gemini:
      api-key: ${AI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}

---
# Dev Profile: Zero-setup persistent MySQL-compatible file database
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/dukaanai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
# MySQL Profile: Connects to local MySQL 3306
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dukaanai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
