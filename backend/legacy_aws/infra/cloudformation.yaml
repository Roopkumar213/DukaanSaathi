AWSTemplateFormatVersion: '2010-09-09'
Description: 'DukaanAI - AWS Foundation Stack (API Gateway, Lambda, DynamoDB, S3, Bedrock Access, CloudWatch)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment stage for resource naming

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Default foundation model ID to authorize for Builder 1 and Lambda

Resources:
  # ==============================================================================
  # 1. DynamoDB: Single-Table Architecture for Kirana Store Data
  # ==============================================================================
  DukaanAITable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'dukaanai-${Environment}-table'
      BillingMode: PAY_PER_REQUEST # Zero idle cost, hackathon friendly
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true # AWS managed key encryption at rest
      Tags:
        - Key: Project
          Value: DukaanAI
        - Key: Environment
          Value: !Ref Environment

  # ==============================================================================
  # 2. S3 Bucket: Audio notes, receipt images, voice bill uploads
  # ==============================================================================
  DukaanAIMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'dukaanai-${Environment}-media-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTempUploadsAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*'] # Restrict to frontend domain in production
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: DukaanAI
        - Key: Environment
          Value: !Ref Environment

  # ==============================================================================
  # 3. CloudWatch: Centralized logging with 14-day retention
  # ==============================================================================
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/dukaanai-${Environment}-backend'
      RetentionInDays: 14 # Keeps log storage small and costs near zero

  # ==============================================================================
  # 4. IAM: Least-Privilege Execution Role for Backend Lambda
  # ==============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'dukaanai-${Environment}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Logging permissions
        - PolicyName: CloudWatchLoggingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LambdaLogGroup.Arn

        # Granular DynamoDB CRUD
        - PolicyName: DynamoDBCRUDPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt DukaanAITable.Arn
                  - !Sub '${DukaanAITable.Arn}/index/*'

        # Granular S3 Media Access
        - PolicyName: S3MediaStoragePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${DukaanAIMediaBucket.Arn}/*'

        # Bedrock Access for AI Assistant Execution
        - PolicyName: BedrockInvocationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:provisioned-model/*'

  # ==============================================================================
  # 5. IAM: Standalone Managed Policy for Builder 1 (Bedrock Dev & Local Testing)
  # ==============================================================================
  Builder1BedrockPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'dukaanai-${Environment}-builder1-bedrock-access'
      Description: 'Allows Builder 1 to test Bedrock models and access DukaanAI DynamoDB/S3 from local development'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockFoundationModelAccess
            Effect: Allow
            Action:
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: '*'
          - Sid: DukaanAIDevResourcesAccess
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !GetAtt DukaanAITable.Arn
              - !Sub '${DukaanAITable.Arn}/index/*'
              - !Sub '${DukaanAIMediaBucket.Arn}/*'

  # ==============================================================================
  # 6. AWS Lambda: Core Backend Function
  # ==============================================================================
  BackendLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'dukaanai-${Environment}-backend'
      Description: 'DukaanAI main API handler for sales, inventory, khata and Bedrock AI'
      Runtime: python3.10
      Handler: main.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30 # Bedrock generation might take 3-10s
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DYNAMODB_TABLE: !Ref DukaanAITable
          MEDIA_BUCKET: !Ref DukaanAIMediaBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Code:
        ZipFile: |
          import json
          import os

          def lambda_handler(event, context):
              path = event.get('rawPath', event.get('path', '/'))
              method = event.get('requestContext', {}).get('http', {}).get('method', event.get('httpMethod', 'GET'))
              
              if path == '/api/health' or path == '/health':
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({
                          'status': 'healthy',
                          'service': 'DukaanAI Backend',
                          'environment': os.environ.get('ENVIRONMENT', 'dev'),
                          'dynamoTable': os.environ.get('DYNAMODB_TABLE'),
                          'mediaBucket': os.environ.get('MEDIA_BUCKET'),
                          'bedrockModel': os.environ.get('BEDROCK_MODEL_ID')
                      })
                  }
              
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({'message': f'DukaanAI API active: {method} {path}'})
              }
      Tags:
        - Key: Project
          Value: DukaanAI
        - Key: Environment
          Value: !Ref Environment

  # ==============================================================================
  # 7. Amazon API Gateway: HTTP API (v2)
  # ==============================================================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'dukaanai-${Environment}-http-api'
      ProtocolType: HTTP
      Description: 'DukaanAI REST/HTTP API endpoint for frontend and voice ingest'
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: ['Content-Type', 'Authorization', 'X-Amz-Date', 'X-Api-Key', 'X-Amz-Security-Token']
        MaxAge: 300

  # Lambda Integration
  HttpApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendLambdaFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  # Default Catch-all Route
  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${HttpApiLambdaIntegration}'

  # Specific API Route
  HttpApiProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/{proxy+}'
      Target: !Sub 'integrations/${HttpApiLambdaIntegration}'

  # Stage
  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  # Lambda Permission for API Gateway invocation
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

# ==============================================================================
# Stack Outputs
# ==============================================================================
Outputs:
  Region:
    Description: Stack deployment region
    Value: !Ref AWS::Region

  ApiEndpoint:
    Description: HTTP API Gateway base endpoint URL
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ApiHealthUrl:
    Description: Direct URL to test Lambda & API Gateway health
    Value: !Sub '${HttpApi.ApiEndpoint}/api/health'

  LambdaFunctionName:
    Description: Backend Lambda Function Name
    Value: !Ref BackendLambdaFunction

  DynamoDBTableName:
    Description: Single-Table DynamoDB database
    Value: !Ref DukaanAITable

  MediaBucketName:
    Description: S3 Media & audio storage bucket
    Value: !Ref DukaanAIMediaBucket

  Builder1ManagedPolicyArn:
    Description: IAM Policy to attach to Builder 1 user/role for Bedrock & Dev access
    Value: !Ref Builder1BedrockPolicy
